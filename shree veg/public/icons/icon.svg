<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <!-- Background tile -->
  <rect x="0" y="0" width="512" height="512" rx="112.64" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="112.64" fill="url(#goldGlow)"/>

  <!-- Gold border for non-maskable -->
  <rect x="20.48" y="20.48" width="471.04" height="471.04" rx="95.744" fill="none" stroke="#facc15" stroke-width="10.24" stroke-opacity="0.4"/>

  <!-- Center Devanagari 'श्री' glyph -->
  <g transform="translate(256, 266.24)">
    <text text-anchor="middle" dominant-baseline="middle" font-family="'Noto Sans Devanagari', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="245.76" fill="url(#goldText)" filter="drop-shadow(0px 10.24px 15.36px rgba(0,0,0,0.5))">श्री</text>
  </g>

  <!-- Subtitle badge: Pure Veg dot in square -->
  <g transform="translate(143.36, 399.36)">
    <rect width="225.28" height="56.32" rx="28.16" fill="#166534" fill-opacity="0.95" stroke="#4ade80" stroke-width="5.12"/>
    <circle cx="30.72" cy="28.16" r="12.8" fill="#4ade80"/>
    <text x="61.44" y="38.4" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="23.04" fill="#ffffff" letter-spacing="1">STAFF</text>
  </g>
</svg>