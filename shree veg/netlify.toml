# ==============================================================================
# Netlify Configuration for Shree Pure Veg (Next.js 14 App Router)
# ==============================================================================

[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"

# Next.js Runtime plugin (v5 runtime for Next 14 App Router)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Optional redirects or headers if needed
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
